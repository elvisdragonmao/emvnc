name: Release

# Push a tag like v1.0.0 (or v1.1.0-beta.1 for a pre-release) to build, test and publish a GitHub release.
# The release notes come from docs/releases/<tag>.md when that file exists, otherwise GitHub generates them.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run unit tests
        run: scripts/test.sh

      - name: Build (universal, Release)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}" BUILD_NUMBER="$GITHUB_RUN_NUMBER" scripts/build-xcode.sh

      - name: Check the app bundle
        env:
          TAG: ${{ github.ref_name }}
        run: |
          app=build/Release/emvnc.app
          test "$(lipo -archs "$app/Contents/MacOS/emvnc")" = "x86_64 arm64"
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "${TAG#v}"
          codesign --verify --strict --verbose=2 "$app"

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent Release/emvnc.app "emvnc-${TAG#v}.zip"
          shasum -a 256 "emvnc-${TAG#v}.zip" > "emvnc-${TAG#v}.zip.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          options=(--generate-notes)
          if [[ -f "docs/releases/$TAG.md" ]]; then options=(--notes-file "docs/releases/$TAG.md"); fi
          if [[ "$TAG" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$TAG" --verify-tag --title "emvnc ${TAG#v}" "${options[@]}" \
            "build/emvnc-${TAG#v}.zip" "build/emvnc-${TAG#v}.zip.sha256"
